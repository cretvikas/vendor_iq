services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vendoriq
      POSTGRES_USER: vendoriq
      POSTGRES_PASSWORD: vendoriq_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendoriq -d vendoriq"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vendoriq:vendoriq_local_password@db:5432/vendoriq
      UPLOAD_DIR: /app/uploads
      VERIFICATION_MODE: demo
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DEMO_BLOCKED_TAX_IDS: ${DEMO_BLOCKED_TAX_IDS:-}
    ports: ["8000:8000"]
    volumes:
      - vendor_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: http://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [api]
volumes:
  postgres_data:
  vendor_uploads:
  frontend_node_modules:
